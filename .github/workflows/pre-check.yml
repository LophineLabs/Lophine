name: Pre Check

on:
  push:
  pull_request:

permissions: write-all

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-pr.outputs.skip }}
    steps:
      - name: Check If Open PR Exists
        id: check-pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_count=$(gh pr list --repo ${{ github.repository }} --head ${{ github.ref_name }} --state open --json number --jq 'length')
          if [ "$pr_count" -gt 0 ]; then
            echo "Open PR exists for branch ${{ github.ref_name }}, skipping push CI"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No open PR for branch ${{ github.ref_name }}"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  dispatch-build:
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          gh workflow run build.yml \
            --repo ${{ github.repository }} \
            --ref "$ref" \
            -f is-pr=${{ github.event_name == 'pull_request' }}

  dispatch-qodana:
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Qodana Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          gh workflow run qodana_code_quality.yml \
            --repo ${{ github.repository }} \
            --ref "$ref"
