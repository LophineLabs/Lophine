name: Pre Check For Push

on:
  push:
    paths:
      - 'lophine-server/**'
      - 'lophine-api/**'
      - 'lophine-checkstyle/**'
      - '.github/workflows/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions: write-all

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-pr.outputs.skip }}
    steps:
      - name: Check If Open PR Exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Do not pass --head owner:branch. Unencoded # in the branch name is
          # treated as a URL fragment, so branches like fix/#221 never match.
          prs=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 1000 \
            --json number,headRefName,isCrossRepository)
          pr_count=$(printf '%s\n' "$prs" | jq --arg branch "$BRANCH" \
            '[.[] | select(.headRefName == $branch and .isCrossRepository == false)] | length')
          pr_numbers=$(printf '%s\n' "$prs" | jq -r --arg branch "$BRANCH" \
            '[.[] | select(.headRefName == $branch and .isCrossRepository == false) | .number] | join(",")')
          if [ "$pr_count" -gt 0 ]; then
            echo "Open same-repo PR exists for branch $BRANCH ($pr_numbers), skipping push CI"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open same-repo PR for branch $BRANCH"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch-build:
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo ${{ github.repository }} \
            --ref "${{ github.ref_name }}"

  dispatch-qodana:
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Qodana Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run qodana_code_quality.yml \
            --repo ${{ github.repository }} \
            --ref "${{ github.ref_name }}"
