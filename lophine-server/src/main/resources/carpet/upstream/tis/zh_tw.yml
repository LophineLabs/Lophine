          disabled: "「perTick」動作模式已停用。詳見規則 commandPlayerActionPerTick"
        randomly:
          root:
            help: "一組讓玩家隨機執行動作的亂數產生器\n可用的亂數產生器：\n  uniform：均勻分佈\n  poisson：卜瓦松分佈\n  gaussian：高斯 / 常態分佈\n  triangular：三角分佈\n你可以在目標指令結尾加上 §7--simulate§r，以使用指定的亂數產生器執行模擬測試"
            uniform_deprecation: "已棄用，將在 mc1.21 推出時移除。請改用 §7uniform§r 子指令"
          simulate:
            command: "指令：%1$s"
            samples: "模擬次數：%1$s"
            divider: "======================"
          uniform:
            help: "§l均勻分佈§r，從 §7<min>§r 到 §7<max>§r，閉區間\n[min, max] 範圍內的所有整數被選中的機率皆相同：1 / (max - min + 1)"
          poisson:
            help: "§l卜瓦松分佈§r，由偏移原點與最大值點決定\n此亂數產生器透過以下步驟實作：\n1. 建立一個 λ = §7<maxima>§r - §7<origin>§r 的卜瓦松亂數產生器\n2. 將機率密度函數向 X 軸正方向平移 §7<origin>§r\n3. 完成。現在機率密度函數的起點為 x = §7<origin>§r，最大值點為 x = 7<maxima>§r\n產生的隨機實數間隔會四捨五入為整數，並限制在 [1, +∞) 範圍內，因為玩家動作間隔必須是正整數\n若 λ 大於 50，將自動替換為等價的高斯分佈產生器以提升效能\n你也可以選擇為隨機值指定上限 §7<upper_bound>§r。所有大於上限的值都會被替換為上限值"
            large_origin: "§7<origin>§r 不能大於 §7<maxima>§r"
          gaussian:
            help: "§l高斯 / 常態分佈§r，由 μ（§7<mu>§r）與 σ（§7<sigma>§r）決定\n機率速查表（在 [μ - r, μ + r] 範圍內）：\n  r = 0.32σ：25.0%\n  r = 0.67σ：50.0%\n  r = 1σ：68.3%\n  r = 2σ：95.4%\n  r = 3σ：99.7%\n產生的隨機實數間隔會四捨五入為整數，並限制在 [1, +∞) 範圍內，因為玩家動作間隔必須是正整數\n你也可以選擇為隨機值指定 §7<lower_bound>§r 或 §7<upper_bound>§r。所有超出範圍的值都會被限制在邊界範圍內"
          triangular:
            help: "§l三角分佈§r，由眾數 §7<mode>§r 與偏差量 §7<deviation>§r 決定\n數值範圍：[§7<mode>§r - §7<deviation>§r, §7<mode>§r + §7<deviation>§r]\n你也可以選擇為隨機值指定 §7<lower_bound>§r 或 §7<upper_bound>§r。所有超出範圍的值都會被限制在邊界範圍內"
