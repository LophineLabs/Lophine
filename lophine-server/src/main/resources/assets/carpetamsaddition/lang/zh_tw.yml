        extra:
          '0': "[bone_block] - 當音階盒上方有骨塊時可觸發載入"
          '1': "[wither_skeleton_skull] - 當音階盒上方有凋零骷髏頭顱（放置於音階盒上或掛在牆上皆可）時可觸發載入"
          '2': "[note_block] - 無須附加條件，僅需音階盒即可觸發載入"
